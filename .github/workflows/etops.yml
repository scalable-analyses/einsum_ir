name: etops

# Python suite (builds the native extension). Full 3.10-3.14 matrix runs on the
# Fedora fleet (x86 = lechuck, arm = haggis); macOS is hosted and latest-only
# (DISPATCH/Apple coverage). Sanitizer and deep-nightly legs are decoupled.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.label }} py${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: x86, runner: [self-hosted, Linux, X64], python: "3.10" }
          - { label: x86, runner: [self-hosted, Linux, X64], python: "3.11" }
          - { label: x86, runner: [self-hosted, Linux, X64], python: "3.12" }
          - { label: x86, runner: [self-hosted, Linux, X64], python: "3.13" }
          - { label: x86, runner: [self-hosted, Linux, X64], python: "3.14" }
          - { label: arm, runner: [self-hosted, Linux, ARM64, m4], python: "3.10" }
          - { label: arm, runner: [self-hosted, Linux, ARM64, m4], python: "3.11" }
          - { label: arm, runner: [self-hosted, Linux, ARM64, m4], python: "3.12" }
          - { label: arm, runner: [self-hosted, Linux, ARM64, m4], python: "3.13" }
          - { label: arm, runner: [self-hosted, Linux, ARM64, m4], python: "3.14" }
          - { label: macos, runner: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system deps
        run: bash ci/install-deps.sh
      - name: pytest
        env:
          ETOPS_PYTHON: ${{ matrix.python }}
          ETOPS_HYPOTHESIS_PROFILE: ci
        run: bash ci/etops.sh

  # UBSan over the Python suite.
  sanitizer:
    name: pytest UBSan (openmp)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system deps
        run: bash ci/install-deps.sh
      - name: pytest under UBSan
        env:
          ETOPS_PYTHON: "3.12"
          ETOPS_HYPOTHESIS_PROFILE: ci
          CMAKE_ARGS: "-DCMAKE_BUILD_TYPE=Debug -DETOPS_SANITIZERS=undefined -DETOPS_THREADING_BACKEND=OPENMP"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: bash ci/etops.sh

  nightly:
    name: pytest deep (Hypothesis 1000 + slow TCCG)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install system deps
        run: bash ci/install-deps.sh
      - name: pytest (deep)
        env:
          ETOPS_PYTHON: "3.12"
          ETOPS_HYPOTHESIS_PROFILE: nightly
          ETOPS_RUN_SLOW: "1"
        run: bash ci/etops.sh
