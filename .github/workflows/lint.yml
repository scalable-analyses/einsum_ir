name: lint

# Fast, build-free checks (ruff, mypy, clang-format, textir validate).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy + clang-format + textir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install "ruff>=0.6" "mypy>=1.10" "numpy>=1.26"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Lint
        run: bash ci/lint.sh
