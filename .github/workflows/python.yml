name: python

on:
  push:
  pull_request:
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libopenblas-dev

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config

      - name: Install uv
        run: pip install uv

      - name: Editable install
        run: uv pip install --system -ve ".[test]"

      - name: pytest
        env:
          ETOPS_HYPOTHESIS_PROFILE: ci
        run: pytest tests/ -v

  pytest-asan-ubsan-sequential:
    name: pytest under ASan+UBSan (sequential)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libopenblas-dev

      - name: Install uv
        run: pip install uv

      - name: Editable install (ASan+UBSan + sequential)
        env:
          CMAKE_ARGS: >
            -DCMAKE_BUILD_TYPE=Debug
            -DETOPS_ENABLE_SANITIZERS=ON
            -DETOPS_THREADING_BACKEND=SEQUENTIAL
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: uv pip install --system -ve ".[test]"

      - name: pytest under ASan+UBSan
        env:
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:detect_leaks=1"
          ETOPS_HYPOTHESIS_PROFILE: "ci"
        run: pytest tests/ -v

  pytest-ubsan-openmp:
    name: pytest under UBSan (OpenMP)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libopenblas-dev libomp-dev

      - name: Install uv
        run: pip install uv

      - name: Editable install (UBSan + OpenMP)
        env:
          CMAKE_ARGS: >
            -DCMAKE_BUILD_TYPE=Debug
            -DETOPS_SANITIZERS=undefined
            -DETOPS_THREADING_BACKEND=OPENMP
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: uv pip install --system -ve ".[test]"

      - name: pytest under UBSan
        env:
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          ETOPS_HYPOTHESIS_PROFILE: "ci"
        run: pytest tests/ -v
