name: wheels

# Build the etops / etops-nightly wheels with cibuildwheel.
# Publishing is intentionally omitted for now.
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_linux:
    name: wheels linux ${{ matrix.cibw_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, cibw_arch: x86_64 }
          - { runner: ubuntu-24.04-arm, cibw_arch: aarch64 }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel + setuptools_scm
        run: python -m pip install --upgrade pip cibuildwheel setuptools_scm twine

      # Nightly / manual builds are published as etops-nightly; tag builds stay etops.
      - name: Rename package to etops-nightly
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sed -i.bak 's/^name = "etops"/name = "etops-nightly"/' pyproject.toml
          rm pyproject.toml.bak
          grep '^name = "etops-nightly"' pyproject.toml

      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-manylinux* cp311-manylinux* cp312-manylinux* cp313-manylinux* cp314-manylinux*"
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_ENVIRONMENT_PASS_LINUX: SETUPTOOLS_SCM_PRETEND_VERSION
          CIBW_BEFORE_ALL_LINUX: "command -v dnf >/dev/null && dnf install -y git make gcc-c++ openblas-devel libomp-devel || yum install -y git make gcc-c++ openblas-devel libomp-devel"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: 'python -c "import etops; print(etops.__version__)"'
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="$(python -m setuptools_scm)"
          echo "Building version: ${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m cibuildwheel --output-dir wheelhouse

      - name: twine check
        run: python -m twine check wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.cibw_arch }}
          path: wheelhouse/*.whl

  build_macos:
    name: wheels macos arm64
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel + setuptools_scm
        run: python -m pip install --upgrade pip cibuildwheel setuptools_scm twine

      - name: Rename package to etops-nightly
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          sed -i.bak 's/^name = "etops"/name = "etops-nightly"/' pyproject.toml
          rm pyproject.toml.bak
          grep '^name = "etops-nightly"' pyproject.toml

      - name: Build wheels
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: arm64
          CIBW_BEFORE_ALL_MACOS: brew install cmake ninja libomp openblas
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: 'python -c "import etops; print(etops.__version__)"'
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="$(python -m setuptools_scm)"
          echo "Building version: ${SETUPTOOLS_SCM_PRETEND_VERSION}"
          python -m cibuildwheel --output-dir wheelhouse

      - name: twine check
        run: python -m twine check wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl
